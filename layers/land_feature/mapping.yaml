tables:

  # etldoc: imposm3 -> land_feature_point
  land_feature_point:
    type: point
    columns:
    - name: osm_id
      type: id
    - name: geometry
      type: geometry
    - name: name
      key: name
      type: string
    - name: name_en
      key: name:en
      type: string
    - name: tags
      type: hstore_tags
    - name: wikipedia
      key: wikipedia
      type: string
    mapping:
      natural:
      - saddle
      geological:
      - meteor_crater

  # etldoc: imposm3 -> land_feature_linestring
  land_feature_linestring:
    type: linestring
    columns:
      - name: osm_id
        type: id
      - name: geometry
        type: geometry
      - name: name
        key: name
        type: string
      - name: name_en
        key: name:en
        type: string
      - name: tags
        type: hstore_tags
      - name: wikipedia
        key: wikipedia
        type: string
    mapping:
      natural:
        - ridge
        - cliff
        - valley
        - saddle