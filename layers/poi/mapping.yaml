def_poi_fields: &poi_fields
  - name: osm_id
    type: id
  - name: geometry
    type: geometry
  - name: area
    type: area
  - name: name
    key: name
    type: string
  - name: name_en
    key: name:en
    type: string
  - name: name_de
    key: name:de
    type: string
  - name: tags
    type: hstore_tags
  - name: subclass
    type: mapping_value
  - name: mapping_key
    type: mapping_key
  - name: station
    key: station
    type: string
  - name: funicular
    key: funicular
    type: string
  - name: information
    key: information
    type: string
  - name: uic_ref
    key: uic_ref
    type: string
  - name: ref
    key: ref
    type: string
  - name: religion
    key: religion
    type: string
  - name: level
    key: level
    type: integer
  - name: indoor
    key: indoor
    type: bool
  - name: layer
    key: layer
    type: integer
  - name: sport
    key: sport
    type: string
  - name: operator
    key: operator
    type: string
  - name: network
    key: network
    type: string
  - name: brand
    key: brand
    type: string

def_poi_mapping: &poi_mapping
  aerialway: *poi_mapping_aerialway
  amenity: *poi_mapping_amenity
  barrier: *poi_mapping_barrier
  building: *poi_mapping_building
  highway: *poi_mapping_highway
  historic: *poi_mapping_historic
  landuse: *poi_mapping_landuse
  leisure: *poi_mapping_leisure
  office: *poi_mapping_office
  railway: *poi_mapping_railway
  shop: *poi_mapping_shop
  sport: *poi_mapping_sport
  zoo: *poi_mapping_zoo
  tourism: *poi_mapping_tourism
  waterway: *poi_mapping_waterway

tables:
  # etldoc: imposm3 -> osm_poi_point
  poi_point:
    type: point
    columns: *poi_fields
    mapping: *poi_mapping

  # etldoc: imposm3 -> osm_poi_polygon
  poi_polygon:
    type: polygon
    columns: *poi_fields
    mapping: *poi_mapping
